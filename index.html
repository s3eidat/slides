<main class="s3-main sl-main">
  <section class="sl-hero">
    <h1>Slides</h1>
    <p>Make a presentation, present it with your notes, download .pptx or PDF. Free, no sign-up. Your decks stay on this device.</p>
  </section>

  <div class="sl-app" id="app">
    <div class="sl-top" role="toolbar" aria-label="Presentation">
      <button class="btn small" id="btnNew" type="button" title="New presentation"><svg class="i"><use href="#d-new"/></svg><span class="sl-lbl">New</span></button>
      <label class="sl-name"><span class="sr">Presentation name</span><input class="input" id="deckName" dir="auto" maxlength="120" value="Untitled presentation"></label>
      <div class="sl-grp">
        <button class="btn ghost icon small" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i"><use href="#d-undo"/></svg></button>
        <button class="btn ghost icon small" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="i"><use href="#d-redo"/></svg></button>
      </div>
      <span class="chip sl-save" id="saveState">Not saved yet</span>
      <span class="grow"></span>
      <button class="btn ghost small" id="btnKeys" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg class="i"><use href="#d-keys"/></svg></button>
      <button class="btn small" id="btnDecks" type="button" title="Your presentations and .s3slides files"><svg class="i"><use href="#d-folder"/></svg><span class="sl-lbl">Open</span></button>
      <button class="btn small" id="btnSave" type="button" title="Save a .s3slides file (Ctrl+S)"><svg class="i"><use href="#d-save"/></svg><span class="sl-lbl">Save file</span></button>
      <button class="btn small" id="btnExport" type="button" title="Download .pptx, PDF or PNG (Ctrl+E)"><svg class="i"><use href="#i-download"/></svg><span class="sl-lbl">Download</span></button>
      <span class="sl-split">
        <button class="btn primary small" id="btnPresent" type="button" title="Present from the beginning (F5)"><svg class="i"><use href="#d-present"/></svg>Present</button>
        <button class="btn primary small icon" id="btnPresentMenu" type="button" title="More ways to present" aria-label="More ways to present" aria-haspopup="true"><svg class="i"><use href="#d-caret"/></svg></button>
      </span>
    </div>

    <div class="sl-ins" role="toolbar" aria-label="Insert">
      <span class="sl-split">
        <button class="btn small" id="btnNewSlide" type="button" title="New slide (Ctrl+M)"><svg class="i"><use href="#d-slide"/></svg><span>New slide</span></button>
        <button class="btn small icon" id="btnLayouts" type="button" title="New slide with a layout" aria-label="New slide with a layout" aria-haspopup="true"><svg class="i"><use href="#d-caret"/></svg></button>
      </span>
      <span class="sl-sep"></span>
      <button class="btn ghost small" id="insText" type="button" title="Text box (T)"><svg class="i"><use href="#d-text"/></svg><span class="sl-lbl">Text</span></button>
      <label class="btn ghost small" id="insImage" title="Picture from this device"><svg class="i"><use href="#i-image"/></svg><span class="sl-lbl">Image</span><input type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.svg" multiple hidden></label>
      <button class="btn ghost small" id="insShape" type="button" title="Shapes" aria-haspopup="true"><svg class="i"><use href="#d-shapes"/></svg><span class="sl-lbl">Shape</span></button>
      <button class="btn ghost small" id="insLine" type="button" title="Line or arrow" aria-haspopup="true"><svg class="i"><use href="#d-arrow"/></svg><span class="sl-lbl">Line</span></button>
      <button class="btn ghost small" id="insIcon" type="button" title="Icons" aria-haspopup="true"><svg class="i"><use href="#d-star"/></svg><span class="sl-lbl">Icon</span></button>
      <button class="btn ghost small" id="insTable" type="button" title="Table" aria-haspopup="true"><svg class="i"><use href="#d-table"/></svg><span class="sl-lbl">Table</span></button>
      <button class="btn ghost small" id="insChart" type="button" title="Chart" aria-haspopup="true"><svg class="i"><use href="#d-chart"/></svg><span class="sl-lbl">Chart</span></button>
      <span class="grow"></span>
      <button class="btn ghost small" id="btnSorter" type="button" title="Slide sorter: see and arrange every slide"><svg class="i"><use href="#d-sorter"/></svg><span class="sl-lbl">Sorter</span></button>
      <div class="sl-zoom">
        <button class="btn ghost icon small" id="zOut" type="button" title="Zoom out (Ctrl+-)" aria-label="Zoom out"><svg class="i"><use href="#d-zout"/></svg></button>
        <button class="btn ghost small sl-zl" id="zLabel" type="button" title="Fit (Ctrl+0)">100%</button>
        <button class="btn ghost icon small" id="zIn" type="button" title="Zoom in (Ctrl+=)" aria-label="Zoom in"><svg class="i"><use href="#d-zin"/></svg></button>
      </div>
    </div>

    <div class="sl-body">
      <aside class="sl-strip" id="strip" aria-label="Slides" tabindex="0"></aside>
      <div class="sl-center">
        <div class="sl-stage" id="stage" tabindex="0" aria-label="Slide canvas. Click an object to select it, double-click text to type, arrow keys move the selection.">
          <canvas id="cv"></canvas>
          <textarea id="textEdit" class="sl-textedit" spellcheck="true" aria-label="Edit text" hidden></textarea>
        </div>
        <label class="sl-notes"><span class="sl-nlabel">Speaker notes</span><textarea class="textarea prose" id="notes" dir="auto" rows="3" placeholder="Notes for this slide. Only you see them, in the presenter view."></textarea></label>
      </div>
      <aside class="sl-props" id="props" aria-label="Format"></aside>
    </div>
  </div>
</main>
